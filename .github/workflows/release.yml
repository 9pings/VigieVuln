name: Release
# Publish binaries when a version tag is pushed; manual runs must select that tag.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: package-lock.json }
      - name: verify versions
        run: |
          set -eu
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF" != "refs/tags/$VERSION" ]; then
            echo "::error::Run this workflow on the version tag $VERSION (package.json must match)."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: npm test
      - name: build CLI binaries
        run: |
          set -eu
          build() { mkdir -p "build/$2"; bun build vigievuln.js --compile --target="$1" --outfile="build/$2/$3"; }
          build bun-linux-x64 linux-x64 vigievuln
          build bun-linux-arm64 linux-arm64 vigievuln
          build bun-darwin-x64 macos-x64 vigievuln
          build bun-darwin-arm64 macos-arm64 vigievuln
          build bun-windows-x64 windows-x64 vigievuln.exe
          node scripts/set-windows-icon.js build/windows-x64/vigievuln.exe
      - name: smoke-test the Linux binary offline
        run: |
          build/linux-x64/vigievuln --version
          build/linux-x64/vigievuln scan test/fixtures/monorepo-mixed --offline --no-report
      - name: build and test the musl archive on stock Alpine without network access
        run: npm run build:linux:musl
      - name: verify embedded disk reader in both Linux x64 builds
        run: |
          set -eu
          demo="$RUNNER_TEMP/system-disk"
          mkdir -p "$demo/musl" "$demo/out"
          mkfs.ext4 -q -F -d test/fixtures/polyglot "$demo/root.img" 32M
          build/linux-x64/vigievuln system collect "$demo/root.img" --output "$demo/out/glibc.json"
          tar -xzf "dist/vigievuln-linux-x64-musl-v${VERSION}.tar.gz" -C "$demo/musl"
          docker run --rm --pull never --network none --read-only --tmpfs /tmp \
            --user "$(id -u):$(id -g)" -e HOME=/nonexistent \
            -v "$demo/musl:/vv:ro" -v "$demo/root.img:/root.img:ro" -v "$demo/out:/out" \
            alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc \
            /vv/vigievuln system collect /root.img --output /out/musl.json
          for inventory in "$demo"/out/*.json; do
            jq -e 'any(.targets[].deps[]; .name == "lodash" and .artifactPath == "js/package-lock.json")' "$inventory" >/dev/null
          done
      - run: node scripts/pack-release.js
      - name: archive and checksum
        run: |
          set -eu
          for t in linux-x64 linux-arm64 macos-x64 macos-arm64; do
            mkdir -p "build/$t/licenses/7z-wasm"
            mkdir -p "build/$t/licenses/pep440"
            cp node_modules/@renovatebot/pep440/LICENSE* "build/$t/licenses/pep440/"
            cp node_modules/7z-wasm/{License.txt,unRarLicense.txt} licenses/7z-wasm/LGPL-2.1.txt "build/$t/licenses/7z-wasm/"
            tar -czf "dist/vigievuln-$t-v${VERSION}.tar.gz" -C "build/$t" vigievuln licenses
          done
          cp -r build/linux-x64/licenses build/windows-x64/
          (cd build/windows-x64 && zip -q -9 -r "../../dist/vigievuln-windows-x64-v${VERSION}.zip" vigievuln.exe licenses)
          (cd dist && sha256sum *.tgz *.tar.gz *.zip > SHA256SUMS)
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          node scripts/release-notes.js "$VERSION" CHANGELOG.md dist/RELEASE_NOTES.md
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.tgz dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber
            gh release edit "$VERSION" --draft=false --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$VERSION" dist/*.tgz dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
              --verify-tag --title "VigieVuln ${VERSION}" \
              --notes-file dist/RELEASE_NOTES.md
          fi
