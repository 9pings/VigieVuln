name: Release
# Publish binaries when a version tag is pushed; manual runs must select that tag.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: package-lock.json }
      - name: verify versions
        run: |
          set -eu
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF" != "refs/tags/$VERSION" ]; then
            echo "::error::Run this workflow on the version tag $VERSION (package.json must match)."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - name: build CLI binaries
        run: |
          set -eu
          build() { mkdir -p "build/$2"; bun build vigievuln.js --compile --target="$1" --outfile="build/$2/$3"; }
          build bun-linux-x64 linux-x64 vigievuln
          build bun-linux-arm64 linux-arm64 vigievuln
          build bun-darwin-x64 macos-x64 vigievuln
          build bun-darwin-arm64 macos-arm64 vigievuln
          build bun-windows-x64 windows-x64 vigievuln.exe
      - name: smoke-test the Linux binary offline
        run: |
          build/linux-x64/vigievuln --version
          build/linux-x64/vigievuln -s test/fixtures/monorepo-mixed --offline --no-report
      - run: node scripts/pack-release.js
      - name: archive and checksum
        run: |
          set -eu
          for t in linux-x64 linux-arm64 macos-x64 macos-arm64; do
            tar -czf "dist/vigievuln-$t-v${VERSION}.tar.gz" -C "build/$t" vigievuln
          done
          (cd build/windows-x64 && zip -q -9 "../../dist/vigievuln-windows-x64-v${VERSION}.zip" vigievuln.exe)
          (cd dist && sha256sum *.tgz *.tar.gz *.zip > SHA256SUMS)
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          node scripts/release-notes.js "$VERSION" CHANGELOG.md dist/RELEASE_NOTES.md
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.tgz dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber
            gh release edit "$VERSION" --draft=false --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$VERSION" dist/*.tgz dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
              --verify-tag --title "VigieVuln ${VERSION}" \
              --notes-file dist/RELEASE_NOTES.md
          fi
