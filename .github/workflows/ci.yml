name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cli:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22', '24']
        include:
          - os: windows-latest
            node: '22'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: npm test
      # Offline phase of an air-gapped audit: every codec runs, no advisory data is needed.
      - run: node vigievuln.js scan test/fixtures/monorepo-mixed --export-anonymized deps-smoke.json
      - run: node -e "const d=require('./deps-smoke.json');if(!(d.summary&&JSON.stringify(d).length>1000))process.exit(1)"
      - run: npm pack --dry-run
