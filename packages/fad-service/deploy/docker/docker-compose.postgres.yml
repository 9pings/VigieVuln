# Overlay: run fad-service on PostgreSQL instead of the SQLite volume — then the web
# instances can live on several hosts. From this directory:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build
# Put POSTGRES_PASSWORD in .env. FAD_SERVICE_DB carries the password: environment only.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fad
      POSTGRES_USER: fad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fad", "-d", "fad"]
      interval: 10s
      retries: 6
  web:
    environment:
      FAD_SERVICE_DB: postgres://fad:${POSTGRES_PASSWORD}@postgres:5432/fad
    depends_on: { postgres: { condition: service_healthy } }
  worker:
    environment:
      FAD_SERVICE_DB: postgres://fad:${POSTGRES_PASSWORD}@postgres:5432/fad
    depends_on: { postgres: { condition: service_healthy } }
  backup:
    # SQLite's online backup does not apply: dump PostgreSQL instead.
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "-c", "while true; do pg_dump -Fc -d \"$$URL\" -f /backups/fad-$$(date -u +%Y%m%dT%H%M%SZ).dump && ls -1t /backups/fad-*.dump | tail -n +8 | xargs -r rm; sleep 86400; done"]
    environment:
      URL: postgres://fad:${POSTGRES_PASSWORD}@postgres:5432/fad
    volumes: [data:/backups]
    depends_on: { postgres: { condition: service_healthy } }
volumes:
  pgdata:
